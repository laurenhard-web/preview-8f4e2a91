<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>🔒 Защищенный шлюз превью</title>
  <style>
    body { background:#070b14; color:#f8fafc; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { background:#0f172a; border:1px solid #334155; padding:24px 32px; border-radius:12px; text-align:center; max-width:460px; }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid #475569; background:#020617; color:#fde047; font-family:monospace; margin:12px 0; }
    button { padding:10px 18px; border-radius:8px; border:none; background:#0284c7; color:#fff; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h3>🔒 Доступ только по секретной ссылке</h3>
    <p style="font-size:13px; color:#94a3b8;">Используйте прямую секретную ссылку с UUID-токеном из приватного репозитория или введите токен доступа:</p>
    <input id="tok" placeholder="Введите UUID-токен..." />
    <button onclick="const v=document.getElementById('tok').value.trim(); if(v) location.href='./s/'+v+'/index.html';">Открыть стенд</button>
  </div>
</body>
</html>
